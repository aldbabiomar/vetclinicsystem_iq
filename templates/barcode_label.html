{% extends "base.html" %}
{% block title %}Barcode — {{ item.name }} — {{ clinic_name }}{% endblock %}
{% block content %}
<div class="page-head no-print">
  <div><h1>Barcode Label</h1><p class="page-sub">{{ item.name }}</p></div>
  <div style="display:flex; gap:10px;">
    <button class="btn secondary" id="printBtn" onclick="window.print()" disabled>Print</button>
    <a class="btn secondary" href="{{ url_for('inventory_catalog') }}">Back</a>
  </div>
</div>
<div class="barcode-label-box">
  <div style="font-weight:700; font-size:13px; margin-bottom:6px;">{{ item.name }}</div>
  <svg id="barcodeSvg"></svg>
  <div style="font-size:11px; color:var(--ink-soft);">{{ clinic_name }}</div>
  <p class="small muted no-print" id="barcodeError" style="display:none; color:var(--danger);">
    Could not render the barcode. Try refreshing the page.
  </p>
</div>
<script>
function renderBarcodeLabel() {
  // Auto-generated internal codes are always 13-digit EAN-13 with a
  // correct check digit, but this field can also hold a manufacturer's
  // own barcode (scanned, typed in, or carried over from imported data) —
  // those come in whatever format the manufacturer used. A code that's
  // the *right length* for EAN-13/UPC-A/EAN-8 doesn't necessarily have a
  // *valid* check digit for it (a fat-fingered manual entry, a legacy
  // record, test data, anything) — and JsBarcode strictly validates that
  // checksum and throws rather than rendering something wrong. Checking
  // length alone isn't enough; only pick a checksummed format when the
  // checksum actually checks out, so a numeric-but-invalid code still
  // renders (as CODE128, which has no checksum requirement) instead of
  // failing outright.
  const code = "{{ item.barcode }}";

  function eanCheckDigit(bodyDigits) {
    // Standard EAN check digit: rightmost body digit gets weight 3,
    // alternating from there. Works for both EAN-13 (12-digit body) and
    // EAN-8 (7-digit body).
    let total = 0;
    const reversed = bodyDigits.split('').reverse();
    for (let i = 0; i < reversed.length; i++) {
      total += parseInt(reversed[i], 10) * (i % 2 === 0 ? 3 : 1);
    }
    return (10 - (total % 10)) % 10;
  }

  function upcCheckDigit(body11) {
    let oddSum = 0, evenSum = 0;
    for (let i = 0; i < 11; i++) {
      const d = parseInt(body11[i], 10);
      if (i % 2 === 0) oddSum += d; else evenSum += d;
    }
    return (10 - ((oddSum * 3 + evenSum) % 10)) % 10;
  }

  let format = 'CODE128';
  if (/^\d{13}$/.test(code) && eanCheckDigit(code.slice(0, 12)) === parseInt(code[12], 10)) {
    format = 'EAN13';
  } else if (/^\d{12}$/.test(code) && upcCheckDigit(code.slice(0, 11)) === parseInt(code[11], 10)) {
    format = 'UPC';
  } else if (/^\d{8}$/.test(code) && eanCheckDigit(code.slice(0, 7)) === parseInt(code[7], 10)) {
    format = 'EAN8';
  }
  try {
    JsBarcode('#barcodeSvg', code, {format: format, width: 2, height: 60, fontSize: 14});
    document.getElementById('printBtn').disabled = false;
  } catch (e) {
    document.getElementById('barcodeError').style.display = 'block';
  }
}
</script>
<script src="{{ url_for('static', filename='vendor/JsBarcode.all.min.js') }}"
        onload="renderBarcodeLabel();"
        onerror="document.getElementById('barcodeError').style.display = 'block';"></script>
{% endblock %}
